name: rex_ai
description: "REX AI - منصة ذكاء اصطناعي متكاملة (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.1
  firebase_analytics: ^11.2.0
  firebase_crashlytics: ^4.0.4
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.1.3

  # Networking
  dio: ^5.4.3+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI / Media
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  lottie: ^3.1.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  share_plus: ^11.0.0
  cross_file: ^0.3.4+2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  pdf: ^3.11.1
  purchases_flutter: ^8.4.5

  # Permissions & Connectivity
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

  # Auth (Google / Apple)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
